name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * *'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # rust channels
          - build: stable
            os: ubuntu-24.04
            rust: stable
            target: x86_64-unknown-linux-gnu
            cargo: cargo
            run: true
          - build: beta
            os: ubuntu-24.04
            rust: beta
            target: x86_64-unknown-linux-gnu
            cargo: cargo
            run: true
          - build: nightly
            os: ubuntu-24.04
            rust: nightly
            target: x86_64-unknown-linux-gnu
            cargo: cargo
            run: true

          # release platforms
          - build: linux-amd64
            os: ubuntu-24.04
            rust: stable
            target: x86_64-unknown-linux-musl
            cargo: cargo
            run: true
          - build: linux-arm64
            os: ubuntu-24.04-arm
            rust: stable
            target: aarch64-unknown-linux-musl
            cargo: cargo
            run: true
          - build: freebsd-amd64
            os: ubuntu-24.04
            rust: stable
            target: x86_64-unknown-freebsd
            cargo: cross
            run: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - run: rustup install ${{ matrix.rust }} --target ${{ matrix.target }}
    - if: matrix.cargo == 'cross'
      run: |
        dir="$RUNNER_TEMP/cross-download"
        mkdir "$dir"
        echo "$dir" >> $GITHUB_PATH
        cd "$dir"
        curl -LO "https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz"
        tar xf cross-x86_64-unknown-linux-musl.tar.gz
    - run: ${{ matrix.cargo }} build --workspace --target ${{ matrix.target }}
    - if: ${{ matrix.run }}
      run: ${{ matrix.cargo }} run --target ${{ matrix.target }} -- --help
    - if: ${{ matrix.run }}
      run: ${{ matrix.cargo }} test --workspace --target ${{ matrix.target }}
      env:
        NO_COLOR: "true"

  rustfmt:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - run: rustup install stable --component rustfmt
    - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - run: rustup install stable --component clippy
    - run: cargo clippy --all-targets -- -D warnings

  dependabot-auto-merge:
    needs:
      - test
      - rustfmt
      - clippy
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.event_name == 'pull_request' }}
    steps:
    - run: gh pr merge --auto --rebase "$PR_URL"
      env:
        PR_URL: ${{github.event.pull_request.html_url}}
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx zizmor .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
